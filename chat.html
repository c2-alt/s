<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>寻找张方晴群聊</title>
    <style>
        body { margin: 0; background: #f0f0f0; font-family: sans-serif; }
        #chat-window { display: flex; flex-direction: column; height: 100vh; }
        .chat-header { background: #333; color: white; padding: 15px; text-align: center; font-weight: bold; }
        .chat-body { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .msg-item { display: flex; flex-direction: column; max-width: 80%; align-self: flex-start; }
        .msg-info { font-size: 12px; color: #888; margin-bottom: 2px; }
        .msg-text { background: white; padding: 10px 14px; border-radius: 4px; border: 1px solid #e0e0e0; font-size: 15px; color: #111; word-wrap: break-word; }
        .chat-system-tip { align-self: center; background: rgba(0,0,0,0.05); color: #666; font-size: 12px; padding: 2px 10px; border-radius: 10px; margin: 5px 0; }
        .chat-footer { background: #fff; padding: 10px; border-top: 1px solid #ddd; display: flex; gap: 10px; }
        .chat-footer input { flex: 1; padding: 8px; border: 1px solid #ddd; border-radius: 4px; background: #f5f5f5; }
    </style>
</head>
<body>

    <div id="chat-window">
        <div class="chat-header">寻找张方晴群聊 (25人)</div>
        <div class="chat-body" id="chat-body">
            <div class="chat-system-tip">2026年6月10日 好运连连 创建了群聊</div>
            <div class="chat-system-tip">好运连连 邀请了 静水流深、福满一生、A幸福里物业李经理、章警官、远行、豆芽蔡呀等人加入群聊</div>
            
            <div class="msg-item">
                <div class="msg-info">好运连连</div>
                <div class="msg-text">章警官，监控真的什么都没拍到吗？一个大活人怎么可能从家里凭空消失啊？！</div>
            </div>
            <div class="msg-item">
                <div class="msg-info">A幸福里物业李经理</div>
                <div class="msg-text">我看了好几遍监控，从9号晚上到10号早上，单元门口别说人了，连只猫都没路过。</div>
            </div>
            <div class="msg-item">
                <div class="msg-info">豆芽蔡呀</div>
                <div class="msg-text">我和晴晴以前常去玩的地方都找遍了，没人见到过她。</div>
            </div>
            <div class="msg-item">
                <div class="msg-info">章警官</div>
                <div class="msg-text">我们在考虑进一步扩大搜索范围，大家稍安勿躁。</div>
            </div>

            <div class="chat-system-tip">刚刚 你 通过点击链接加入群聊</div>
        </div>

        <div class="chat-footer">
            <input type="text" placeholder="当前环境异常，输入功能已锁定..." disabled>
            <button style="background:#ccc; color:#fff; border:none; padding:0 15px; border-radius:4px;" disabled>发送</button>
        </div>
    </div>

    <script>
        // 自动滚动到聊天记录最底部
        const chatBody = document.getElementById('chat-body');
        if(chatBody) chatBody.scrollTop = chatBody.scrollHeight;
    </script>
</body>
</html>
