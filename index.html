<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>未知来电</title>
    
    <style>
        /* 全局：黑色背景，居中 */
        body {
            margin: 0; padding: 0;
            background-color: #121212;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden;
            font-family: -apple-system, sans-serif;
            user-select: none; /* 防止玩家长按文字变蓝 */
        }

        /* 📱 手机外壳容器 */
        .phone-container {
            width: 360px;
            height: 780px;
            background-color: #000;
            border: 12px solid #333;
            border-radius: 36px;
            position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            overflow: hidden;
        }

        /* 顶部状态栏（时间、电量） */
        .status-bar {
            height: 30px;
            padding: 0 20px;
            display: flex; justify-content: space-between; align-items: center;
            font-size: 12px; color: #888;
            margin-top: 10px;
            z-index: 10;
            position: relative;
        }

        /* 手机桌面（App图标区） */
        .home-screen {
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        /* App图标样式 */
        .app-icon {
            display: flex; flex-direction: column; align-items: center;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .app-icon:active {
            transform: scale(0.9); /* 点击时缩放一下，像真的按钮 */
        }
        .icon-box {
            width: 55px; height: 55px;
            border-radius: 12px;
            display: flex; justify-content: center; align-items: center;
            font-size: 28px;
            background: linear-gradient(135deg, #ff5722, #ff9800);
        }
        .locked-icon {
            background: #333;
            opacity: 0.5;
        }
        .icon-label {
            font-size: 11px; color: #ccc;
            margin-top: 5px;
            text-align: center;
        }

        /* 底部Home条 */
        .home-bar {
            position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
            width: 120px; height: 4px;
            background-color: #fff; border-radius: 2px;
            z-index: 10;
        }

        /* ==================== 新增：App被点开后的新闻窗口 ==================== */
        .app-window {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: #1a1a1a;
            z-index: 5;
            display: none; /* 默认隐藏 */
            flex-direction: column;
        }
        .window-header {
            height: 40px;
            background-color: #222;
            display: flex; align-items: center;
            padding: 0 15px;
            border-bottom: 1px solid #333;
            margin-top: 40px; /* 留出状态栏空间 */
        }
        .close-btn {
            background: none; border: none;
            color: #ff9800; font-size: 15px;
            cursor: pointer; margin-right: 15px;
        }
        .window-content {
            flex: 1; padding: 20px;
            overflow-y: auto; color: #fff;
            box-sizing: border-box;
        }
        .window-content h2 { font-size: 18px; margin-top: 0; }
        .comment-section { margin-top: 30px; border-top: 1px solid #333; padding-top: 15px; }
        .comment { background: #252525; padding: 10px; border-radius: 8px; font-size: 13px; margin-top: 10px; border-left: 3px solid #ff5722; color: #ffaa88;}
    </style>
</head>
<body>

    <div class="phone-container">
        
        <div class="status-bar">
            <span class="time" id="real-time">00:00</span>
            <span class="battery">⚡ 4%</span>
        </div>

        <div class="home-screen">
            <div class="app-icon" id="news-app">
                <div class="icon-box">📰</div>
                <div class="icon-label">今日热点</div>
            </div>

            <div class="app-icon locked">
                <div class="icon-box locked-icon">💬</div>
                <div class="icon-label">加密群聊</div>
            </div>
        </div>

        <div class="home-bar"></div>

        <div class="app-window" id="news-window">
            <div class="window-header">
                <button class="close-btn" id="close-news">◀ 返回</button>
                <span>今日热点新闻</span>
            </div>
            <div class="window-content">
                <h2>【本市突发】林水小区发生一起深夜坠楼事件</h2>
                <hr style="border: 0.5px solid #333;">
                <p style="font-size: 14px; color: #ccc; line-height: 1.6;">昨日凌晨2点45分，我市林水小区14号楼发生一起高空坠落事件。死者张某（男，24岁）当场身亡。警方已排除他杀可能。案件正在进一步调查中。</p>
                <div class="comment-section">
                    <h3 style="font-size: 14px; color: #888; margin: 0;">热门评论 (1)</h3>
                    <div class="comment">
                        <strong>【该用户已被封禁】：</strong> 根本不是自杀！我是对面楼的，他是自己“飘”下去的！！
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        // 【1. 自动同步现实时间的功能】
        function updateTime() {
            const timeElement = document.getElementById('real-time');
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            
            // 如果小时或分钟小于10，在前面补个“0”（比如 09:05）
            if (hours < 10) hours = '0' + hours;
            if (minutes < 10) minutes = '0' + minutes;
            
            timeElement.innerText = hours + ':' + minutes;
        }
        
        // 游戏一打开立刻运行一次时间，并且每隔1秒钟（1000毫秒）自动刷新一次时间
        updateTime();
        setInterval(updateTime, 1000);


        // 【2. 点击图标打开/关闭新闻的功能】
        const newsApp = document.getElementById('news-app');
        const newsWindow = document.getElementById('news-window');
        const closeNews = document.getElementById('close-news');

        // 点击新闻图标，把新闻窗口显示出来
        newsApp.addEventListener('click', () => {
            newsWindow.style.display = 'flex';
        });

        // 点击返回按钮，把新闻窗口藏起来
        closeNews.addEventListener('click', () => {
            newsWindow.style.display = 'none';
        });
    </script>
    </body>
</html>
